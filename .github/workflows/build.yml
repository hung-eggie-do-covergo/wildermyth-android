name: Build

# The app (amethyst/) needs wmcloud/ from this repo, so it is built here, not in the submodule.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The Java 8 runtime the game runs on; not kept in git. Upstream's artifact expires, so a copy lives
      # on the app repo's releases.
      - name: Get Java 8 runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download jre8-f03a5a0 -R hung-eggie-do-covergo/amethyst-wildermyth \
            -D amethyst/app_pojavlauncher/src/main/assets/components/jre

      - name: Build debug APK
        working-directory: amethyst
        run: ./gradlew :app_pojavlauncher:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: amethyst/app_pojavlauncher/build/outputs/apk/debug/*.apk
